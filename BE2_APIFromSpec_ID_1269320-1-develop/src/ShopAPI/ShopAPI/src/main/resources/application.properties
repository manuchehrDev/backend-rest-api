spring.application.name=ShopAPI
spring.datasource.url=jdbc:postgresql://localhost:5433/shopdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

server.port=8080




# ???? ? OpenAPI ???????????? (JSON/YAML)
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true

# ???? ? Swagger UI (????????????? ????????????)
springdoc.swagger-ui.path=/swagger/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-model-expand-depth=3
springdoc.swagger-ui.default-models-expand-depth=3
springdoc.show-actuator=true
springdoc.writer-with-default-pretty-printer=true
springdoc.use-fqn=false
springdoc.cache.disabled=true